[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paper-distiller"
version = "0.1.0"
description = "A CLI framework for distilling research papers into structured Markdown knowledge bases."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Paper Distiller Contributors" }
]
keywords = [
  "research",
  "papers",
  "literature-review",
  "knowledge-base",
  "markdown",
  "llm"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Text Processing :: Markup :: Markdown"
]
dependencies = [
  "jinja2>=3.1",
  "pydantic>=2.7",
  "pypdf>=4.2",
  "rich>=13.7",
  "tomli>=2.0.1; python_version<'3.11'",
  "typer>=0.12"
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
ui = ["streamlit>=1.35"]
dev = [
  "pytest>=8.2",
  "ruff>=0.5"
]

[project.scripts]
paper-distiller = "paper_distiller.cli:app"
paper-distiller-ui = "paper_distiller.ui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_distiller"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
